<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="admin.css">
    <script src="config.js"></script>
</head>
<body>

    <!-- Login de admin -->
    <div id="adminLogin" class="admin-login">
        <div class="admin-login-box">
            <div class="admin-logo">🔐</div>
            <h1>Panel de Administración</h1>
            <p>Acceso restringido</p>
            <form id="adminLoginForm" novalidate>
                <input type="password" id="adminPassword" placeholder="Contraseña de administrador" autocomplete="off" required>
                <div id="adminLoginError" class="error-msg hidden">Contraseña incorrecta</div>
                <button type="submit" class="btn-admin">Acceder</button>
            </form>
        </div>
    </div>

    <!-- Panel principal -->
    <div id="adminPanel" class="admin-panel hidden">

        <header class="admin-header">
            <div>
                <h1>🔐 Panel de Administración</h1>
                <p class="admin-sub">Gestión de usuarios del sitio</p>
            </div>
            <div style="display:flex;gap:10px;align-items:center;">
                <a href="login.html" class="btn-logout" style="text-decoration:none;">← Volver al login</a>
                <button class="btn-logout" onclick="adminLogout()">Cerrar sesión</button>
            </div>
        </header>

        <main class="admin-main">

            <!-- Crear usuario -->
            <section class="admin-card">
                <h2>➕ Nuevo usuario</h2>
                <form id="createUserForm" class="create-form" novalidate>
                    <div class="form-row">
                        <input type="text"     id="newUsername" placeholder="Nombre de usuario" maxlength="30" required autocomplete="off">
                        <input type="password" id="newPassword" placeholder="Contraseña (mín. 6 caracteres)" required autocomplete="new-password">
                        <button type="submit" class="btn-admin btn-create">Crear usuario</button>
                    </div>
                    <div id="createError"   class="error-msg   hidden"></div>
                    <div id="createSuccess" class="success-msg hidden"></div>
                </form>
            </section>

            <!-- Lista de usuarios -->
            <section class="admin-card">
                <h2>👥 Usuarios registrados</h2>
                <div id="usersList" class="users-list">
                    <div class="loading-msg">Cargando...</div>
                </div>
            </section>

            <!-- Carta para ti -->
            <section class="admin-card">
                <h2>✉️ Carta "Para ti"</h2>
                <textarea id="cartaEditor" rows="6" placeholder="Escribe la carta..." style="width:100%;padding:12px;border-radius:10px;border:1px solid #2a2a5a;background:#0d1117;color:#e0e0f0;font-size:0.93rem;font-family:inherit;resize:vertical;outline:none;"></textarea>
                <div style="margin-top:10px;display:flex;gap:10px;align-items:center;">
                    <button class="btn-admin btn-create" onclick="guardarCarta()">Guardar carta</button>
                    <span id="cartaStatus" style="font-size:0.82rem;color:#4ade80;"></span>
                </div>
            </section>

            <!-- Frases motivacionales -->
            <section class="admin-card">
                <h2>💡 Frases motivacionales</h2>
                <div id="frasesList" class="frases-admin-list"></div>
                <div style="margin-top:12px;display:flex;gap:8px;">
                    <input type="text" id="nuevaFrase" placeholder="Escribe una nueva frase..." maxlength="300" style="flex:1;padding:10px 14px;border-radius:10px;border:1px solid #2a2a5a;background:#0d1117;color:#e0e0f0;font-size:0.88rem;outline:none;">
                    <button class="btn-admin btn-create" onclick="agregarFrase()">Agregar</button>
                </div>
                <div style="margin-top:10px;display:flex;gap:10px;align-items:center;">
                    <button class="btn-admin btn-create" onclick="guardarFrases()">Guardar frases</button>
                    <span id="frasesStatus" style="font-size:0.82rem;color:#4ade80;"></span>
                </div>
            </section>

            <!-- Historial de sesiones -->
            <section class="admin-card">
                <h2>🕵️ Historial de sesiones</h2>
                <button class="btn-admin btn-create" onclick="loadSessions()" style="margin-bottom:14px;">Actualizar</button>
                <div id="sessionsList" class="sessions-list">
                    <div class="loading-msg">Haz clic en "Actualizar"</div>
                </div>
            </section>

        </main>
    </div>

    <script src="admin-panel.js"></script>

</body>
</html>
